services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nxkit_store
      MYSQL_USER: nxkit
      MYSQL_PASSWORD: nxkit
      MYSQL_ROOT_PASSWORD: nxkit-root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnxkit-root"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # 只监听本机，由宿主机 nginx 终止 TLS 后反代
      - "127.0.0.1:8080:8080"
    environment:
      DB_DSN: nxkit:nxkit@tcp(mysql:3306)/nxkit_store?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      # 线上 token 由部署机的 .env 提供（.env 已 gitignore）；缺失时直接报错，避免回落到弱默认值。
      NXKIT_ADMIN_TOKEN: ${NXKIT_ADMIN_TOKEN:?请在 .env 中设置 NXKIT_ADMIN_TOKEN}
      # 后台登录（密码 + TOTP）。未设置哈希/密钥时只保留 token 登录。
      NXKIT_ADMIN_USER: ${NXKIT_ADMIN_USER:-admin}
      NXKIT_ADMIN_PASSWORD_HASH: ${NXKIT_ADMIN_PASSWORD_HASH:-}
      NXKIT_ADMIN_TOTP_SECRET: ${NXKIT_ADMIN_TOTP_SECRET:-}
      NXKIT_DATA_DIR: /data
    volumes:
      - server-data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
  server-data:
