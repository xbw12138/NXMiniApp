# NXMiniApp 官网 / 商店入口的 nginx 站点配置（Ubuntu 24.04，nginx 1.24）
#
# 部署位置：/etc/nginx/sites-available/nxminiapp
# 启用：ln -s /etc/nginx/sites-available/nxminiapp /etc/nginx/sites-enabled/
# 前置条件：docker-compose.yml 中 server 端口为 127.0.0.1:8080:8080
# 证书：acme.sh 签发 Let's Encrypt 证书（HTTP-01 webroot /var/www/acme）
#   curl https://get.acme.sh | sh -s email=admin@ecfun.cc
#   ~/.acme.sh/acme.sh --issue -d ecfun.cc -w /var/www/acme --keylength ec-256
#   ~/.acme.sh/acme.sh --install-cert -d ecfun.cc \
#     --key-file /etc/nginx/ssl/ecfun.cc.key \
#     --fullchain-file /etc/nginx/ssl/ecfun.cc.pem \
#     --reloadcmd "systemctl reload nginx"

server {
    listen 80;
    listen [::]:80;
    server_name ecfun.cc www.ecfun.cc;

    client_max_body_size 64m;

    # acme.sh HTTP-01 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://ecfun.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecfun.cc www.ecfun.cc;

    ssl_certificate     /etc/nginx/ssl/ecfun.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/ecfun.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 投稿包最大 32MB，留出截图与表单余量
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
